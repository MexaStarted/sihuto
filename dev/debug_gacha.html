<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マルチバース英雄召喚デバッグ — 開発者の現在</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#07060f;color:#eee;font-family:-apple-system,'Segoe UI',sans-serif}
  .wrap{max-width:460px;margin:0 auto;padding-bottom:40px}
  .top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1a1a2a;position:sticky;top:0;background:#07060f;z-index:30}
  .top h1{font-size:14px;font-weight:800;color:#c8a0ff;letter-spacing:1px}
  .coins{margin-left:auto;font-size:13px;font-weight:800;color:#FFD700;font-family:monospace}
  .panel{padding:16px}
  .btnrow{display:flex;gap:10px;margin-bottom:14px}
  .gbtn{flex:1;padding:16px 8px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;color:#fff;line-height:1.4}
  .gbtn small{display:block;font-size:10px;opacity:.85;margin-top:3px;font-weight:600}
  .g1{background:linear-gradient(135deg,#5d9eff,#3a5bff)}
  .g10{background:linear-gradient(135deg,#c8a0ff,#7a3bff)}
  .gbtn:active{transform:scale(.97)}
  .gbtn:disabled{opacity:.4;cursor:not-allowed}
  .util{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .ubtn{padding:9px 14px;border-radius:8px;border:1px solid #2a2a40;background:#13121f;color:#aab;font-size:11px;cursor:pointer}
  .rates{font-size:10px;color:#778;line-height:1.7;background:#0d0c18;border-radius:8px;padding:10px;margin-bottom:8px}
  h3{font-size:11px;color:#8af;margin:14px 0 8px;letter-spacing:1px}
  /* コレクション */
  .coll{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .citem{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;border:1.5px solid #222;background:#100f1c;position:relative}
  .citem.owned{border-color:#3a3a55}
  .citem.miss{opacity:.25;font-size:18px}
  .citem .dup{position:absolute;bottom:1px;right:3px;font-size:8px;color:#FFD700;font-weight:800}
  .cn{font-size:6px;color:#99a;margin-top:1px;text-align:center;line-height:1;padding:0 1px;overflow:hidden;max-height:12px}
  /* 召喚オーバーレイ */
  #sum{position:fixed;inset:0;z-index:100;display:none;background:radial-gradient(ellipse at 50% 45%,#0a0a1e,#03020a 75%)}
  #sum.on{display:block}
  #sum-sky{position:absolute;inset:0;overflow:hidden}
  .sgrain{position:absolute;left:50%;top:-6%;width:9px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(#fff,#ffe);box-shadow:0 0 10px #fff;transform:translateX(-50%)}
  .segg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:60px;z-index:5}
  .shero{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(0);z-index:6;text-align:center}
  .shero .he{font-size:84px;filter:drop-shadow(0 0 16px currentColor)}
  .shero .hn{font-size:15px;font-weight:900;margin-top:4px}
  .shero .hr{font-size:11px;font-weight:800;letter-spacing:2px}
  .shero .hd{font-size:9px;color:#bbc;margin-top:4px;max-width:240px;margin-left:auto;margin-right:auto;line-height:1.4}
  .sburst{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
  #sum-next{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;color:#aab;z-index:9;animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  #sum-prog{position:absolute;top:10px;right:14px;font-size:11px;color:#889;z-index:9;font-family:monospace}
  /* 10連結果 */
  #res{position:fixed;inset:0;z-index:90;display:none;background:rgba(3,2,10,.96);overflow-y:auto;padding:50px 14px 20px}
  #res.on{display:block}
  .resgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:440px;margin:0 auto}
  .rcard{aspect-ratio:.8;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;border:2px solid;position:relative;animation:rpop .4s ease-out both}
  @keyframes rpop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .rcard .rn{font-size:7px;margin-top:2px;color:#ccd;text-align:center;line-height:1.1;padding:0 2px}
  .rcard .rNew{position:absolute;top:2px;left:3px;font-size:7px;color:#ff5b6b;font-weight:900}
  #res-close{display:block;margin:18px auto 0;padding:12px 30px;border-radius:10px;border:none;background:#5d9eff;color:#fff;font-weight:800;font-size:14px;cursor:pointer}
  #res-title{text-align:center;font-size:14px;font-weight:800;color:#c8a0ff;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">

    <span style="font-size:18px">🍣</span>

    </div>
    <div class="util">
      <button class="ubtn" onclick="addCoins(1000)">＋1000コイン（デバッグ）</button>
      <button class="ubtn" onclick="resetColl()">コレクション全消去</button>
    </div>
    <h3 id="coll-title">コレクション 0 / 100</h3>
    <div class="coll" id="coll"></div>
  </div>
</div>

<div id="sum">

  <div id="sum-prog"></div>
  <div id="sum-next">タップで進む ▶</div>
</div>

<div id="res">

  <div class="resgrid" id="res-grid"></div>
  <button id="res-close" onclick="closeRes()">とじる</button>
</div>

{id:'g100',emoji:'🍣',name:'伝説・サーモン握り／不沈の握り',role:'tank',rarity:'UR',desc:'英検4級を極め（？）、復讐も赦しも越えて世界の盾となった究極のサーモン。',passive:['不沈艦：パーティ全員が、HP1未満になっても1ターン耐える','無限の米：毎ターン味方全体を大回復＋全状態異常を解除','握りの覚悟：自分が場にいる限り、味方は即死しない']}
];

// レアリティ別の排出率（%）
const GACHA_RATES={N:48,R:30,SR:15,SSR:6,UR:1};
// レアリティ表示色
const GACHA_RARITY_COLOR={N:'#9aa0b0',R:'#5dca8a',SR:'#5d9eff',SSR:'#c8a0ff',UR:'#FFD700'};

// ===== コイン（ShiftMemo共通 localStorage 'coins'） =====
function getCoins(){try{return parseInt(localStorage.getItem('coins')||'0',10)||0;}catch(e){return 0;}}
function setCoins(n){try{localStorage.setItem('coins',String(Math.max(0,n)));}catch(e){}updateCoinDisp();}
function addCoins(n){setCoins(getCoins()+n);}
function updateCoinDisp(){document.getElementById('coin-disp').textContent='🪙 '+getCoins().toLocaleString('en-US');
  const c=getCoins();document.getElementById('b1').disabled=c<100;document.getElementById('b10').disabled=c<1000;}

// ===== コレクション（localStorage 'rpg_gacha_owned'） =====
function getOwned(){try{return JSON.parse(localStorage.getItem('rpg_gacha_owned')||'{}');}catch(e){return {};}}
function saveOwned(o){try{localStorage.setItem('rpg_gacha_owned',JSON.stringify(o));}catch(e){}}

// ===== 排出ロジック =====
function rollRarity(){
  const r=Math.random()*100;let acc=0;
  for(const k of ['UR','SSR','SR','R','N']){ // 高レア優先で判定
    acc+=GACHA_RATES[k];
    if(r<=acc&&false)break; // 下のループで正しく処理
  }
  // 正しい累積判定（N→URの順で）
  let x=Math.random()*100,a=0;
  for(const k of ['N','R','SR','SSR','UR']){a+=GACHA_RATES[k];if(x<a)return k;}
  return 'N';
}
function rollOne(){
  const rar=rollRarity();
  const pool=GACHA_CHARS.filter(c=>c.rarity===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}

// ===== 召喚演出 =====
let sumQueue=[],sumIdx=0,sumIsMulti=false,sumResults=[];
function pull(n){
  const cost=n===10?1000:100;
  if(getCoins()<cost){alert('コインが足りません');return;}
  setCoins(getCoins()-cost);
  sumResults=[];for(let i=0;i<n;i++)sumResults.push(rollOne());
  // 所持に反映＆new判定
  const owned=getOwned();
  sumResults.forEach(r=>{r._isNew=!owned[r.id];owned[r.id]=(owned[r.id]||0)+1;});
  saveOwned(owned);
  sumIsMulti=(n===10);sumQueue=sumResults.slice();sumIdx=0;
  document.getElementById('sum').className='on';
  playSummon(sumQueue[0]);
}
function playSummon(hero){
  const sky=document.getElementById('sum-sky');sky.innerHTML='';
  document.getElementById('sum-prog').textContent=sumIsMulti?((sumIdx+1)+' / '+sumQueue.length):'';
  const col=GACHA_RARITY_COLOR[hero.rarity];
  // 1. 米粒が涙のように落ちる
  const grain=document.createElement('div');grain.className='sgrain';sky.appendChild(grain);
  grain.animate([{top:'-6%',opacity:0},{top:'10%',opacity:1,offset:.15},{top:'44%',opacity:1}],{duration:900,easing:'cubic-bezier(.5,0,.7,1)',fill:'forwards'});
  // 2. 着地→卵出現
  setTimeout(()=>{
    grain.remove();
    const egg=document.createElement('div');egg.className='segg';egg.textContent='🥚';sky.appendChild(egg);
    // レア色のオーラ
    const aura=document.createElement('div');aura.className='sburst';aura.style.cssText+=`;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,${col}55,transparent 70%)`;sky.appendChild(aura);
    aura.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.5)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.4)'}],{duration:600,fill:'forwards'});
    // 卵が揺れる（レアほど長く・激しく）
    const shakeN=hero.rarity==='UR'?6:hero.rarity==='SSR'?5:hero.rarity==='SR'?4:3;
    egg.animate([{transform:'translate(-50%,-50%) rotate(0)'},{transform:'translate(-52%,-50%) rotate(-8deg)'},{transform:'translate(-48%,-50%) rotate(8deg)'},{transform:'translate(-50%,-50%) rotate(0)'}],{duration:300,iterations:shakeN});
    // 3. 割れて英雄登場
    setTimeout(()=>{egg.remove();crackBurst(col,hero.rarity);revealHero(hero,col);},shakeN*300+200);
  },900);
}
function crackBurst(col,rar){
  const sky=document.getElementById('sum-sky');
  const count=rar==='UR'?40:rar==='SSR'?28:rar==='SR'?18:10;
  for(let i=0;i<count;i++){const ang=Math.random()*360,dist=60+Math.random()*120;
    const p=document.createElement('div');p.textContent=(rar==='UR'||rar==='SSR')?'✦':'・';
    p.style.cssText=`position:absolute;left:50%;top:46%;color:${col};font-size:${10+Math.random()*14}px;z-index:5;transform:translate(-50%,-50%)`;sky.appendChild(p);
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px)) scale(1)`,opacity:0}],{duration:800,easing:'ease-out'});
    setTimeout(()=>p.remove(),800);
  }
  // フラッシュ（高レアほど強い）
  const fl=document.createElement('div');fl.style.cssText=`position:absolute;inset:0;background:${col};z-index:4`;sky.appendChild(fl);
  const fa=rar==='UR'?.9:rar==='SSR'?.7:rar==='SR'?.5:.25;
  fl.animate([{opacity:0},{opacity:fa},{opacity:0}],{duration:600});setTimeout(()=>fl.remove(),600);
}
function revealHero(hero,col){
  const sky=document.getElementById('sum-sky');
  const roleJP={attacker:'アタッカー',tank:'タンク',healer:'ヒーラー',buffer:'バッファー',debuffer:'デバッファー',trickster:'トリッキー'};
  const box=document.createElement('div');box.className='shero';box.style.color=col;
  const passHtml=hero.passive.length===3
    ? '★ゲーム破壊級パッシブ×3'
    : 'パッシブ：'+hero.passive[0];
  box.innerHTML=`<div class="he">${hero.emoji}</div>`+
    `<div class="hr" style="color:${col}">${hero.rarity}${hero._isNew?' ✨NEW':''}</div>`+
    `<div class="hn" style="color:#fff">${hero.name}</div>`+
    `<div class="hd">[${roleJP[hero.role]}] ${hero.desc}</div>`+
    `<div class="hd" style="color:${col}">${passHtml}</div>`;
  sky.appendChild(box);
  box.animate([{transform:'translate(-50%,-50%) scale(0) rotate(-15deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.15) rotate(5deg)',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1}],{duration:700,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'forwards'});
}
// タップで次へ
document.getElementById('sum').onclick=()=>{
  sumIdx++;
  if(sumIdx<sumQueue.length){playSummon(sumQueue[sumIdx]);}
  else{
    document.getElementById('sum').className='';
    if(sumIsMulti){showResults();}
    renderColl();
  }
};
function showResults(){
  const grid=document.getElementById('res-grid');grid.innerHTML='';
  const order={UR:0,SSR:1,SR:2,R:3,N:4};
  const sorted=sumResults.slice().sort((a,b)=>order[a.rarity]-order[b.rarity]);
  sorted.forEach((r,i)=>{const col=GACHA_RARITY_COLOR[r.rarity];
    const d=document.createElement('div');d.className='rcard';d.style.borderColor=col;d.style.background=col+'18';d.style.animationDelay=(i*0.06)+'s';
    d.innerHTML=`${r._isNew?'<div class="rNew">NEW</div>':''}<div>${r.emoji}</div><div class="hr" style="font-size:8px;color:${col};font-weight:800">${r.rarity}</div><div class="rn">${r.name}</div>`;
    grid.appendChild(d);});
  document.getElementById('res').className='on';
}
function closeRes(){document.getElementById('res').className='';renderColl();}

// ===== コレクション表示 =====
function renderColl(){
  const owned=getOwned();const cnt=Object.keys(owned).length;
  document.getElementById('coll-title').textContent='コレクション '+cnt+' / 100';
  const order={UR:0,SSR:1,SR:2,R:3,N:4};
  const sorted=GACHA_CHARS.slice().sort((a,b)=>order[a.rarity]-order[b.rarity]);
  document.getElementById('coll').innerHTML=sorted.map(c=>{
    const o=owned[c.id];const col=GACHA_RARITY_COLOR[c.rarity];
    if(o)return `<div class="citem owned" style="border-color:${col}66"><div>${c.emoji}</div><div class="cn">${c.name}</div>${o>1?'<div class="dup">×'+o+'</div>':''}</div>`;
    return `<div class="citem miss">❓</div>`;
  }).join('');
}
function resetColl(){if(confirm('コレクションを全消去しますか？')){saveOwned({});renderColl();}}

// 初期化
document.getElementById('rates').innerHTML='排出率：'+['UR','SSR','SR','R','N'].map(k=>k+' '+GACHA_RATES[k]+'%').join('　/　')+'<br>UR6体はゲーム破壊級パッシブ×3。コインはShiftMemo共通。';
if(getCoins()===0)setCoins(3000); // デバッグ初期コイン
updateCoinDisp();renderColl();
</script>
