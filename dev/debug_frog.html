<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カエル感動シーン 10パターン — 開発者の現在</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,'Hiragino Sans','Segoe UI',sans-serif}
  #stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#13283a,#0a1620 70%,#060e16);overflow:hidden;transition:background 1s}
  #rain{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  #frog{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:90px;z-index:5;transition:filter .3s;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  #frogeyes{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:6;display:none}
  #frogeyes::before,#frogeyes::after{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:#ff2b2b;box-shadow:0 0 12px 4px #f00;top:0}
  #frogeyes::before{left:-18px}#frogeyes::after{left:7px}
  #allies{position:absolute;left:0;right:0;bottom:30%;display:flex;justify-content:center;gap:30px;z-index:4}
  .ally{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
  #slasher{position:absolute;font-size:48px;z-index:7;opacity:0;left:-10%;top:42%}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
  #vig{position:absolute;inset:0;z-index:7;pointer-events:none;box-shadow:inset 0 0 160px 50px rgba(0,0,0,.7)}
  .bar{position:absolute;left:0;right:0;height:8%;background:#000;z-index:9;pointer-events:none}
  .bar.top{top:0}.bar.bot{bottom:0}
  /* セリフ */
  #talkbox{position:absolute;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(transparent,#000d 28%);padding:60px 22px 14%;min-height:34%}
  #spk{font-size:14px;font-weight:900;margin-bottom:8px;text-shadow:0 0 8px currentColor}
  #txt{font-size:16px;line-height:1.8;color:#fff;text-shadow:0 1px 3px #000;min-height:60px}
  #tap{position:absolute;right:20px;bottom:13%;font-size:12px;color:#8df;z-index:11;animation:blink 1s infinite;opacity:0}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  #cutname{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:9;font-size:30px;font-weight:900;color:#ff3b3b;opacity:0;white-space:nowrap;text-shadow:0 0 18px #ff3b3b,2px 2px 0 #000}
  /* start */
  #start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse,#0a1620,#000);gap:18px;padding:20px}
  #start h1{color:#8fe3c0;font-size:17px;letter-spacing:2px;text-align:center;line-height:1.6;text-shadow:0 0 12px #2a6a4a}
  #start p{color:#789;font-size:11px;text-align:center;line-height:1.6}
  select{padding:11px 14px;border-radius:10px;background:#0a1620;color:#8fe3c0;border:1px solid #2a6a4a;font-size:13px;max-width:300px}
  #playbtn{padding:14px 38px;border-radius:26px;border:1px solid #5dca8a;background:linear-gradient(135deg,#143a2a,#0a1a14);color:#8fe3c0;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 0 20px #2a6a4a66}
  #playbtn:active{transform:scale(.97)}
  #skip{position:fixed;right:12px;top:calc(8% + 8px);z-index:60;font-size:11px;color:#9ab;background:rgba(0,0,0,.5);padding:5px 12px;border-radius:14px;cursor:pointer;display:none}
  #replay{position:fixed;left:50%;bottom:calc(8% + 16px);transform:translateX(-50%);z-index:60;display:none;padding:12px 26px;border-radius:24px;border:1px solid #5dca8a;background:#0a1a14;color:#8fe3c0;font-weight:700;cursor:pointer}
  #endmsg{position:fixed;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;z-index:55;font-size:15px;color:#ff8b8b;opacity:0;letter-spacing:2px;text-shadow:0 0 12px #8b0000;padding:0 30px;line-height:1.7}
</style>
</head>
<body>
<div id="stage">
  <div id="rain"></div>
  <div id="frog">🐸</div>
  <div id="frogeyes"></div>
  <div id="allies"></div>
  <div id="slasher">🧑‍🎨</div>
  <div id="cutname"></div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div class="bar top"></div><div class="bar bot"></div>
  <div id="endmsg"></div>
  <div id="talkbox"><div id="spk"></div><div id="txt"></div></div>
  <div id="tap">▼ タップ</div>
</div>
<div id="skip" onclick="skipScene()">スキップ ▶▶</div>
<button id="replay" onclick="location.reload()">↻ もう一度見る</button>
<div id="start">
  <h1>第2話 感動シーン<br><span style="font-size:12px;color:#789">― 優しい心の雨 ―</span></h1>
  <p>正気を失いゆくカエルとの、別れのシーン。<br>カエルが主役。思い出が薄れ、自我が消えていく。約3分。</p>
  <select id="patsel"></select>
  <button id="playbtn" onclick="startScene()">▶ 再生する</button>
</div>

<script>
// 話者の色・絵文字
const SPEAKERS={
  'かえる':{c:'#5dca8a',e:'🐸'},
  '開発者':{c:'#5d9eff',e:'🧑‍💻'},
  'ねこ':{c:'#e5b85d',e:'🐱'},
  'UFO乗組員':{c:'#b388ff',e:'👽'},
  '☆1レビュアー':{c:'#c8b0ff',e:'🧑‍🎨'},
  'ナレーション':{c:'#8899aa',e:''}
};
// 演出コマンド付きのスクリプト。type:talk/fx
// fx: rain/eyeflicker/slash/zombie/quake/flashなど
const PATTERNS=[
{name:'本編：優しい心の雨（約3分・70ラリー）',lines:[
 {fx:'rainStart'},
 {s:'ナレーション',t:'――優しい雨が、静かに降っていた。'},
 {s:'ナレーション',t:'戦いの音は、もう聞こえない。'},
 {s:'かえる',t:'……ふう。雨だ。'},
 {s:'かえる',t:'なんだか、ひさしぶりに、ほっとするなあ。'},
 {s:'開発者',t:'かえる。気分は、どうだ。'},
 {s:'かえる',t:'うん。今はね、すごく、おだやかだよ。'},
 {s:'かえる',t:'……今は、ね。'},
 {s:'ねこ',t:'…無理すんな。座ってろよ。'},
 {s:'かえる',t:'だいじょうぶ。立てるうちは、立っていたいんだ。'},
 {s:'かえる',t:'ぼく、盾だからさ。座ってちゃ、かっこつかない。'},
 {s:'かえる',t:'ねえ、覚えてる？ ぼくたちが、はじめて会った日のこと。'},
 {s:'開発者',t:'…ああ。お前、ガチガチに緊張してた。'},
 {s:'かえる',t:'そうそう。何もできないぼくが、何の役に立てるんだろうって。'},
 {s:'かえる',t:'でも、きみが言ったんだ。「お前は、前に立てる」って。'},
 {s:'かえる',t:'うれしかったなあ。ぼくにも、居場所があるんだって。'},
 {s:'かえる',t:'それから、ずっと盾をやってきた。みんなを守るのが、ぼくの誇りだった。'},
 {s:'ねこ',t:'…知ってるよ。何度、お前に助けられたか。'},
 {s:'かえる',t:'えへへ。役に立ててたなら、よかった。'},
 {s:'かえる',t:'あ、そうだ。タコパ、楽しかったよね。'},
 {s:'かえる',t:'ぼく、ほんとはたこ焼き、大好きだったんだ。'},
 {s:'開発者',t:'……知ってた。お前、いつも最後の一個、譲ってただろ。'},
 {s:'かえる',t:'バレてた？ えへへ。みんなが食べてるの、見るの好きだったから。'},
 {s:'かえる',t:'あの時間が、ぼくは、いちばん……'},
 {fx:'eyeflicker'},
 {s:'かえる',t:'…っ。'},
 {s:'かえる',t:'……あれ。今、なに、話してたんだっけ。'},
 {s:'ねこ',t:'…かえる？'},
 {s:'かえる',t:'あ、ごめん。タコパの、話だ。うん。覚えてる。覚えてるよ。'},
 {s:'かえる',t:'……たこ焼きって、どんな味だったかな。'},
 {s:'開発者',t:'…っ。'},
 {s:'かえる',t:'やだな。思い出せない。さっきまで、覚えてたのに。'},
 {s:'かえる',t:'こうやって、ひとつずつ、消えていくんだね。ぼくの中から。'},
 {s:'かえる',t:'こわいよ。すごく、こわい。'},
 {s:'かえる',t:'でも、もっとこわいのはね。'},
 {fx:'eyeflicker'},
 {s:'かえる',t:'さっき、みんなの顔が……ごはんに、見えたんだ。'},
 {s:'ねこ',t:'…！'},
 {s:'かえる',t:'おいしそうだなって、思っちゃった。ほんの一瞬。'},
 {s:'かえる',t:'ぞっとした。それ、もう、ぼくじゃないだろ。'},
 {s:'かえる',t:'ぼくの中に、ぼくじゃない"なにか"が、増えていってる。'},
 {s:'かえる',t:'ねえ、みんなの名前。ちゃんと、言えるかな。'},
 {s:'かえる',t:'えっと……きみが、開発者。それから……'},
 {fx:'eyeflicker'},
 {s:'かえる',t:'……ねこ。そう、ねこだ。よかった、まだ言える。'},
 {s:'かえる',t:'まだ、ぼくは、ぼくだ。…まだ。'},
 {s:'開発者',t:'かえる、しっかりしろ。お前は、かえるだ。'},
 {s:'かえる',t:'うん。うん、そうだよね。……ねえ。'},
 {s:'かえる',t:'お願いが、あるんだ。'},
 {s:'かえる',t:'ぼくが、まだ、ぼくでいるうちに。'},
 {s:'かえる',t:'……殺して、ほしいんだ。'},
 {s:'ねこ',t:'…っ、何言ってんだよ！'},
 {s:'開発者',t:'できるわけ、ないだろ。そんなこと。'},
 {s:'かえる',t:'うん。みんなが、そう言ってくれるって、わかってた。'},
 {s:'かえる',t:'やさしいから。みんな、ずっと、やさしかったから。'},
 {s:'かえる',t:'でもね。このままだと、ぼくは、みんなを食べちゃう。'},
 {s:'かえる',t:'みんなを傷つける"ぼく"に、なりたくないんだ。'},
 {s:'かえる',t:'ぼくの、最後のわがまま。聞いて、くれないかな。'},
 {fx:'eyeflicker'},
 {s:'かえる',t:'っ……ぐ。…はやく、しないと。もう、あんまり、時間が……'},
 {s:'かえる',t:'…あれ。きみ、だれ、だっけ。'},
 {s:'開発者',t:'……っ！'},
 {s:'かえる',t:'…ごめん。ごめんね。わかってるのに。大事な人だって、わかってるのに。'},
 {s:'かえる',t:'名前が、出てこない。顔は、見えてるのに。'},
 {s:'かえる',t:'ぼくの中の"ぼく"が、どんどん、薄くなっていく。'},
 {s:'かえる',t:'…もう、いいよね。じゅうぶん、生きたよ。'},
 {s:'かえる',t:'みんなと過ごせて、幸せだった。それだけは、ぜったいに、忘れない。'},
 {s:'かえる',t:'……たとえ、ぜんぶ忘れても。それだけは。'},
 {s:'かえる',t:'だから――おねがい。'},
 {s:'ねこ',t:'…おれには、できねえよ。できるわけ、ねえだろ…っ。'},
 {s:'開発者',t:'…っ、くそ…！'},
 {s:'かえる',t:'…そうだよね。ごめん。困らせて、ごめんね。'},
 {fx:'eyeflicker'},
 {s:'かえる',t:'…ぁ。…ぁあ……。だめだ、きちゃう。"あれ"が、くる。'},
 {s:'かえる',t:'はやく……だれか……ぼくを……!'},
 {fx:'slasherIn'},
 {s:'☆1レビュアー',t:'――その役目、オレが引き受ける。'},
 {s:'かえる',t:'…だ、れ……?'},
 {s:'☆1レビュアー',t:'通りすがりの批評家だ。お前らにできないなら、オレがやる。'},
 {s:'☆1レビュアー',t:'…おい、そこの二人。目を逸らすなよ。こいつを、覚えてろ。'},
 {fx:'slash'},
 {s:'かえる',t:'……あり、がと……。みんな、だい、すき……。'},
 {fx:'frogDown'},
 {s:'ナレーション',t:'カエルは、ほんの少しだけ微笑んで、膝をついた。'},
 {fx:'zombie'},
 {s:'ナレーション',t:'――だが。その小さな幸せすら、ウイルスは、許さなかった。'},
 {s:'☆1レビュアー',t:'…立て。あれは、もう、お前たちの知るカエルじゃない。'},
 {fx:'end'}
]}
];

let SC=PATTERNS[0],idx=0,typing=false,typer=null,skipReq=false;
const frog=document.getElementById('frog'),frogeyes=document.getElementById('frogeyes'),
  stage=document.getElementById('stage'),rain=document.getElementById('rain'),
  slasher=document.getElementById('slasher'),flash=document.getElementById('flash'),
  cutname=document.getElementById('cutname'),txt=document.getElementById('txt'),
  spk=document.getElementById('spk'),tap=document.getElementById('tap'),
  endmsg=document.getElementById('endmsg');

function buildAllies(){document.getElementById('allies').innerHTML=['🧑‍💻','🐱','👽'].map(e=>`<div class="ally">${e}</div>`).join('');}

let rainTimer=null;
function rainStart(color){if(rainTimer)clearInterval(rainTimer);rainTimer=setInterval(()=>{const x=Math.random()*100;const d=document.createElement('div');d.style.cssText=`position:absolute;left:${x}%;top:-5%;width:2px;height:${12+Math.random()*10}px;background:linear-gradient(${color||'#7ec8b0'},transparent);opacity:.6`;rain.appendChild(d);d.animate([{transform:'translateY(0)',opacity:0},{transform:'translateY(40px)',opacity:.7,offset:.2},{transform:'translateY(600px)',opacity:0}],{duration:1100,easing:'linear'});setTimeout(()=>d.remove(),1150);},60);
  // 光が中心に集う（優しい心の雨）
  setInterval(()=>{},9999);}
function eyeflicker(){frog.style.filter='brightness(.5) saturate(.6) hue-rotate(-15deg)';frogeyes.style.display='block';
  setTimeout(()=>{frog.style.filter='';frogeyes.style.display='none';},500);
  stage.animate([{filter:'none'},{filter:'brightness(1.2) saturate(1.3)'},{filter:'none'}],{duration:500});
  // 記憶が薄れて消えていく演出：思い出の欠片が浮かんで散る
  const mems=['🍕','🎈','☀️','🏠','😊','🐱','🧑‍💻','✨','🌸','🍻'];
  for(let i=0;i<5;i++){const d=document.createElement('div');d.textContent=mems[Math.floor(Math.random()*mems.length)];
    d.style.cssText=`position:absolute;left:${30+Math.random()*40}%;top:${30+Math.random()*30}%;font-size:${18+Math.random()*14}px;z-index:6;opacity:0;filter:grayscale(.5)`;stage.appendChild(d);
    d.animate([{opacity:0,transform:'scale(1)',filter:'blur(0px) grayscale(0)'},{opacity:.8,transform:'scale(1.1) translateY(-10px)',filter:'blur(0px)',offset:.3},{opacity:0,transform:'scale(.5) translateY(-50px)',filter:'blur(6px) grayscale(1)'}],{duration:1600,delay:i*100,easing:'ease-out'});
    setTimeout(()=>d.remove(),1800+i*100);}
  // 軽いノイズ・グリッチ感
  stage.animate([{transform:'translate(0,0)'},{transform:'translate(-3px,1px)'},{transform:'translate(3px,-1px)'},{transform:'translate(0,0)'}],{duration:200,iterations:2});
}
function slasherIn(){slasher.style.opacity='1';slasher.animate([{left:'-10%',opacity:0},{left:'30%',opacity:1}],{duration:600,fill:'forwards'});}
function doSlash(){
  // 一閃・赤・スロー
  stage.animate([{filter:'brightness(1)'},{filter:'brightness(1.4)'},{filter:'brightness(1)'}],{duration:600});
  slasher.animate([{left:'30%',opacity:1},{left:'120%',opacity:0}],{duration:500,fill:'forwards'});
  setTimeout(()=>{
    const line=document.createElement('div');line.style.cssText='position:absolute;left:50%;top:42%;width:160%;height:3px;background:linear-gradient(90deg,transparent,#ff3b3b,transparent);transform:translate(-50%,-50%) scaleX(0);box-shadow:0 0 14px #ff3b3b;z-index:7';stage.appendChild(line);
    line.animate([{transform:'translate(-50%,-50%) scaleX(0)',opacity:0},{transform:'translate(-50%,-50%) scaleX(1)',opacity:1,offset:.3},{transform:'translate(-50%,-50%) scaleX(1)',opacity:0}],{duration:600});
    flash.style.background='#ff3b3b';flash.animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:500});
    frog.animate([{transform:'translate(-50%,-50%)'},{transform:'translate(-52%,-50%)'},{transform:'translate(-50%,-50%)'}],{duration:300});
    cutname.textContent='一閃';cutname.animate([{opacity:0,transform:'translate(-50%,-50%) scale(2.4)',letterSpacing:'12px'},{opacity:1,transform:'translate(-50%,-50%) scale(1)',letterSpacing:'2px',offset:.3},{opacity:1,offset:.8},{opacity:0}],{duration:1400});
    setTimeout(()=>line.remove(),700);
  },300);
}
function frogDown(){frog.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},{transform:'translate(-50%,-40%) rotate(20deg)',opacity:.6}],{duration:800,fill:'forwards'});}
function zombie(){
  // ゾンビ化：暗転気味→赤眼→瘴気→咆哮
  stage.style.background='radial-gradient(ellipse at 50% 45%,#1a0808,#0e0404 70%,#050101)';
  if(rainTimer)clearInterval(rainTimer);rainStart('#8b1a1a');
  setTimeout(()=>{
    frog.animate([{transform:'translate(-50%,-40%) rotate(20deg)',opacity:.6,filter:'none'},{transform:'translate(-50%,-50%) rotate(0) scale(1.15)',opacity:1,filter:'brightness(.45) saturate(.5) contrast(1.3) hue-rotate(-15deg)'}],{duration:900,fill:'forwards'});
    frogeyes.style.display='block';
    // 瘴気
    for(let i=0;i<10;i++){const d=document.createElement('div');d.textContent='☁';d.style.cssText=`position:absolute;left:${Math.random()*100}%;top:90%;font-size:${30+Math.random()*20}px;color:#1a0505;z-index:4`;stage.appendChild(d);d.animate([{transform:'translateY(0)',opacity:0},{transform:'translateY(-60px)',opacity:.8,offset:.4},{transform:'translateY(-120px)',opacity:0}],{duration:1600,delay:i*80});setTimeout(()=>d.remove(),1700+i*80);}
    flash.style.background='#5a0000';flash.animate([{opacity:0},{opacity:.6},{opacity:0}],{duration:700});
    stage.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,3px)'},{transform:'translate(4px,-2px)'},{transform:'translate(0,0)'}],{duration:400,iterations:3});
  },400);
}
function endScene(){
  endmsg.innerHTML='― BATTLE START ―<br><span style="font-size:11px;color:#aab">後半戦：闇堕ちしたカエル</span>';
  endmsg.animate([{opacity:0},{opacity:1}],{duration:1200,fill:'forwards'});
  document.getElementById('replay').style.display='block';
  document.getElementById('skip').style.display='none';
  tap.style.opacity='0';
}

// ===== 進行 =====
function next(){
  if(typing){ // タイプ中なら即完了
    clearInterval(typer);txt.textContent=curFull;typing=false;tap.style.opacity='1';return;
  }
  if(idx>=SC.lines.length){return;}
  const line=SC.lines[idx++];
  if(line.fx){runFx(line.fx);
    // fxだけの行は少し待って自動で次へ（演出尺）
    const waits={rainStart:300,eyeflicker:700,slasherIn:700,slash:1700,frogDown:900,zombie:2400,end:0};
    if(line.fx==='end'){endScene();return;}
    tap.style.opacity='0';
    setTimeout(()=>{if(!skipReq)next();},waits[line.fx]||500);
    return;
  }
  // セリフ
  showTalk(line);
}
let curFull='';
function showTalk(line){
  const sp=SPEAKERS[line.s]||{c:'#fff',e:''};
  spk.textContent=(sp.e?sp.e+' ':'')+line.s;spk.style.color=sp.c;
  curFull=line.t;txt.textContent='';tap.style.opacity='0';typing=true;
  // 感情でタイプ速度
  let speed=42;if(/[！!]{1,}|殺/.test(line.t))speed=28;if(/[…。]$/.test(line.t)||line.s==='ナレーション')speed=55;
  let i=0;typer=setInterval(()=>{if(i>=curFull.length){clearInterval(typer);typing=false;tap.style.opacity='1';return;}txt.textContent+=curFull[i++];},speed);
}
function runFx(name){({rainStart:()=>rainStart('#7ec8b0'),eyeflicker,slasherIn,slash:doSlash,frogDown,zombie,end:()=>{}})[name]?.();}

// タップで進む
stage.onclick=()=>{if(document.getElementById('start').style.display!=='none')return;next();};

function skipScene(){skipReq=true;if(rainTimer)clearInterval(rainTimer);zombie();setTimeout(endScene,1500);}

function startScene(){
  SC=PATTERNS[+document.getElementById('patsel').value||0];idx=0;skipReq=false;
  document.getElementById('start').style.display='none';
  document.getElementById('skip').style.display='block';
  buildAllies();next();
}
(function(){const sel=document.getElementById('patsel');PATTERNS.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;sel.appendChild(o);});})();
</script>
</body>
</html>
