<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FANTOK 解析ダッシュ v3</title>
<style>
:root{--bg:#05070c;--panel:#0b1018;--elev:#121a28;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.05);
 --cy:#2ee6e6;--mg:#ff3b5c;--am:#ffc34d;--tx:#eef3f9;--mut:#7e8b9d;--faint:#485364;--ink:#03121a;
 --up:#3ddc84;--dn:#ff5a6e;--sans:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);padding:0 14px 90px;max-width:1100px;margin:0 auto}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 82%,rgba(5,7,12,0));padding:14px 2px 8px}
h1{font-size:19px;font-weight:900;letter-spacing:1px}
h1 b{color:var(--cy)} h1 .ver{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:8px;font-weight:700}
.upd{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:3px}
.hbtns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.hb{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block}
.hb.pri{background:var(--cy);border-color:var(--cy);color:var(--ink)}
#banner{display:none;margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(255,195,77,.12);border:1px solid rgba(255,195,77,.4);color:var(--am);font-size:12.5px;font-weight:700}
#banner button{margin-left:10px;border:1px solid var(--am);background:none;color:var(--am);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer}
#summary{margin:6px 0 10px;font-size:13px;line-height:1.8;color:var(--tx)}
#summary .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:800;border-radius:999px;padding:4px 11px;border:1px solid var(--line);color:var(--mut)}
.chip.hot{border-color:rgba(61,220,132,.5);color:var(--up)} .chip.warn{border-color:rgba(255,90,110,.55);color:var(--dn)}
.tabbar{position:sticky;top:0;z-index:39;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 -2px 12px;background:linear-gradient(180deg,var(--bg) 72%,rgba(5,7,12,0));scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.dtab{flex:0 0 auto;position:relative;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--sans)}
.dtab.on{background:var(--cy);border-color:var(--cy);color:var(--ink)}
.dtab .dot{position:absolute;top:2px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--mg);display:none}
.dtab.unread .dot{display:block}
.tabpane{display:none}.tabpane.active{display:block;animation:df .18s ease}
@keyframes df{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px;margin-bottom:12px}
.sec h2{font-size:13.5px;color:var(--cy);letter-spacing:1px;margin-bottom:11px;font-weight:800;cursor:pointer;user-select:none}
.sec h2 .bdg{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:7px;vertical-align:1px;font-family:var(--mono)}
.sec h2::after{content:"▾";float:right;color:var(--faint);font-size:12px}
.sec.clps h2::after{content:"▸"}
.sec.clps > *:not(h2){display:none}
@media(min-width:900px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .sec{margin-bottom:12px}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:var(--elev);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;cursor:pointer}
.kpi .l{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.5px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:800;margin-top:3px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.kpi .s{font-size:10px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.dl{font-size:11px;font-weight:800;font-family:var(--mono)} .dl.up{color:var(--up)} .dl.dn{color:var(--dn)} .dl.fl{color:var(--faint)}
.spark{display:block;margin-top:5px}
.rev{width:100%;border-collapse:collapse;font-size:12.5px}
.rev th{color:var(--faint);text-align:right;font-weight:700;font-size:10.5px;padding:4px 6px;border-bottom:1px solid var(--line)}
.rev th:first-child,.rev td:first-child{text-align:left}
.rev td{padding:7px 6px;border-bottom:1px solid var(--line2);font-family:var(--mono)}
.rev td:first-child{font-family:var(--sans);font-weight:700}
.rev .tag{font-family:var(--mono);color:var(--faint);font-size:10px;margin-left:5px}
.ctrrow{display:flex;gap:9px;margin-top:11px}
.ctr{flex:1;background:var(--elev);border:1px solid var(--line2);border-radius:11px;padding:10px}
.ctr .l{font-size:10px;color:var(--mut);font-weight:700}
.ctr .v{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--cy);margin-top:3px}
.blist .row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.blist .rk{width:18px;color:var(--faint);font-family:var(--mono);font-size:11px;text-align:right}
.blist .mv{width:34px;font-family:var(--mono);font-size:10px;font-weight:800}
.mv.up{color:var(--up)} .mv.dn{color:var(--dn)} .mv.new{color:var(--am)} .mv.fl{color:var(--faint)}
.blist .nm{flex:0 0 34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.blist .nm a{color:var(--tx);text-decoration:none;border-bottom:1px dashed var(--faint)}
.blist .bar{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden}
.blist .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),#0bb1c6);border-radius:5px}
.blist .ct{width:44px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.secops{display:flex;gap:7px;margin:2px 0 10px;flex-wrap:wrap}
.sop{border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:4px 10px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.sop.on{border-color:var(--cy);color:var(--cy)}
.trend{display:flex;align-items:flex-end;gap:2px;height:130px;margin-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.trend .bt{background:linear-gradient(180deg,var(--cy),#0bb1c6);border-radius:3px 3px 0 0;min-height:2px;position:relative;overflow:hidden}
.trend .bt .nw{position:absolute;left:0;right:0;bottom:0;background:rgba(255,59,92,.75)}
.trend .col.today .bt{box-shadow:0 0 10px rgba(46,230,230,.5)}
.trend .dl2{font-size:8px;color:var(--faint);text-align:center;margin-top:3px;font-family:var(--mono);height:10px}
.trend .mk{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--am)}
.hour{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:6px}
.hb2{flex:1;background:rgba(46,230,230,.25);border-radius:2px 2px 0 0;min-height:2px}
.hb2.on{background:linear-gradient(180deg,var(--cy),#0bb1c6)}
.hlbl{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);font-family:var(--mono);margin-top:4px}
.heat{display:grid;grid-template-columns:26px repeat(24,1fr);gap:2px;margin-top:8px}
.heat .hd2{font-size:8.5px;color:var(--faint);font-family:var(--mono);display:flex;align-items:center}
.heat .c{aspect-ratio:1/1.15;border-radius:2px;background:rgba(46,230,230,.06)}
.hist{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:8px}
.hist .hcol{flex:1;text-align:center}
.hist .hbar{background:linear-gradient(180deg,var(--am),#c98f2a);border-radius:4px 4px 0 0;min-height:2px}
.hist .hl2{font-size:9px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
.hist .hv{font-size:10px;color:var(--mut);font-family:var(--mono)}
.fun .fr{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.fun .fl2{width:52px;font-size:11px;font-weight:800;color:var(--mut)}
.fun .fb2{flex:1;height:22px;border-radius:6px;background:rgba(255,255,255,.04);overflow:hidden}
.fun .fb2 i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),#0bb1c6);border-radius:6px;min-width:2px}
.fun .fv{width:130px;font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right}
.setrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.setrow input[type=number],.setrow input[type=text],.setrow input[type=date],.setrow select{background:var(--elev);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:12px;width:82px}
.setrow input[type=text]{width:150px}
.est{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--am);margin-top:6px}
.est .sub2{font-size:11px;color:var(--faint);font-weight:700;margin-left:8px}
.gbar{height:10px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:8px}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--up),#22b56b)}
.fblist{display:flex;flex-direction:column;gap:8px}
.fbitem{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-left:3px solid var(--cy);border-radius:8px;padding:9px 11px}
.fbitem.done{opacity:.45;border-left-color:var(--faint)}
.fbmeta{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fbmsg{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.note{font-size:11px;color:var(--faint);line-height:1.8;margin-top:9px}
.health{font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:2}
.health b{color:var(--tx)}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.envc{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--mut);font-weight:700}
.envc b{color:var(--tx);font-family:var(--mono);margin-left:5px}
.empty{color:var(--faint);font-size:12px;padding:6px 0}
.warnrow{color:var(--dn);font-weight:800;font-size:12px;margin-top:6px}
.notesL .ni{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:6px;font-family:var(--mono)}
.ni .del{margin-left:auto;border:1px solid var(--line);background:none;color:var(--faint);border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer}
#topBtn{position:fixed;right:16px;bottom:20px;z-index:50;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--cy);font-size:17px;display:none;cursor:pointer}
#tip{position:fixed;z-index:60;background:#101826;border:1px solid rgba(46,230,230,.4);border-radius:9px;padding:8px 11px;font-size:11.5px;font-family:var(--mono);display:none;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toastB{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#101826;border:1px solid rgba(46,230,230,.45);color:var(--tx);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;z-index:70;display:none}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--cy);font-size:11px;font-family:var(--mono);transition:height .15s}
#pinOv{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#pinOv input{background:var(--elev);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 14px;font-family:var(--mono);font-size:18px;width:170px;text-align:center;letter-spacing:5px}
.blurnum .v,.blurnum .est,.blurnum .fv,.blurnum .ct,.blurnum td,.blurnum .fbmsg,.blurnum .envc b{filter:blur(6px)}
.skel .sk{background:linear-gradient(90deg,var(--panel),var(--elev),var(--panel));background-size:200% 100%;animation:sh 1.1s infinite;border-radius:12px;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.dis{color:var(--faint)!important}
</style>
</head>
<body>
<div id="pinOv"><div style="font-weight:900;font-size:16px">🔒 PIN を入力</div><input id="pinIn" inputmode="numeric" maxlength="8"><button class="hb pri" onclick="pinTry()">解除</button></div>
<div id="ptr">↓ 引っ張って更新</div>
<header>
  <h1><b>FANTOK</b> 解析ダッシュ<span class="ver" id="ver"></span></h1>
  <div class="upd" id="upd">読み込み中…</div>
  <div class="hbtns">
    <button class="hb pri" onclick="loadData(true)">⟳ 更新</button>
    <a class="hb" id="rawL" target="_blank" rel="noopener">📄 生データ</a>
    <button class="hb" onclick="toggleBlur()">🫥 ぼかし</button>
    <button class="hb" onclick="copyWeekly()">📋 週次レポ</button>
    <button class="hb pri" onclick="copyAll()">📤 フィードバック用コピー</button>
  </div>
</header>
<div id="banner"></div>
<div id="summary"></div>
<div class="tabbar" id="tabbar" role="tablist"></div>
<div id="main"><div class="skel"><div class="sk" style="height:120px"></div><div class="sk" style="height:180px"></div><div class="sk" style="height:140px"></div></div></div>
<button id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div id="tip"></div>
<div id="toastB"></div>
<script>
/* ================= FANTOK 解析ダッシュ v3 ================= */
const GAS='https://script.google.com/macros/s/AKfycby5YrRgR64ufncCbZKvBCrh1OiCgviK14J6wR4H-s9l1A8LWgy_S3q_9o7ySoskh8YMsw/exec';
const SHEET='https://docs.google.com/spreadsheets/d/1YudvVpLseJcub_gn-LvviIEN_VISIW_3ZeW-RY3Qa-E/edit';
const VER='v3.0';
const $g=id=>document.getElementById(id);
const ls=(k,v)=>{ if(v===undefined){ try{const x=localStorage.getItem(k);return x===null?null:JSON.parse(x);}catch(e){return null;} } try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n||0).toLocaleString();
const pct=(a,b)=>b>0?Math.round(a/b*1000)/10:0;
const fmtDur=s=>{s=Math.round(s||0);return s>=60?Math.floor(s/60)+'分'+(s%60)+'秒':s+'秒';};
let D=null, PERIOD=+(ls('dash_period')||14), TOPN=+(ls('dash_topn')||10), ACTIVE=(location.hash||'').slice(1)||ls('dash_tab')||'overview';
let fetchedAt=0, PREV=ls('dash_prev')||{};
const DOWS=['日','月','火','水','木','金','土'];
function toast(m){ const t=$g('toastB'); t.innerHTML=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',1700); }
function copyText(t,msg){ try{ navigator.clipboard.writeText(t); toast(msg||'コピーしました'); }catch(e){ toast('コピー失敗'); } }
function csvDL(name,rows){ const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})); a.download=name; a.click(); }
/* ---------- PIN (195) ---------- */
function pinTry(){ if($g('pinIn').value===String(ls('dash_pin')||'')){ $g('pinOv').style.display='none'; } else { toast('PINが違います'); $g('pinIn').value=''; } }
/* ---------- 取得 (062/065/066) ---------- */
async function loadData(force){
  if(force) toast('更新中…');
  try{
    const r=await fetch(GAS+'?action=dashboard&_='+Date.now());
    const j=await r.json();
    if(!j||!j.ok) throw new Error('bad payload');
    D=j; fetchedAt=Date.now(); ls('dash_cache',{at:fetchedAt,d:j});
    $g('banner').style.display='none';
    renderAll();
  }catch(e){
    const c=ls('dash_cache');
    if(c&&c.d){ D=c.d; fetchedAt=c.at; renderAll();
      $g('banner').innerHTML='⚠ 取得失敗のため前回キャッシュを表示中 <button onclick="loadData(true)">再試行</button>'; $g('banner').style.display='block';
    } else {
      $g('main').innerHTML='<div class="sec"><div class="warnrow">データ取得に失敗しました</div><div class="note">'+esc(e.message||'')+'</div><button class="hb pri" style="margin-top:10px" onclick="loadData(true)">再試行</button></div>';
    }
  }
}
/* ---------- 部品 ---------- */
function delta(cur,prev){ if(prev===0&&cur===0) return '<span class="dl fl">±0%</span>';
  if(prev===0) return '<span class="dl up">NEW</span>';
  const p=Math.round((cur-prev)/prev*100);
  return p>0?'<span class="dl up">▲'+p+'%</span>':(p<0?'<span class="dl dn">▼'+Math.abs(p)+'%</span>':'<span class="dl fl">±0%</span>');
}
function spark(arr,w,h){ w=w||88;h=h||24; const mx=Math.max.apply(null,[1].concat(arr));
  const pts=arr.map((v,i)=>((i/(arr.length-1))*w).toFixed(1)+','+((h-2)-(v/mx*(h-4))).toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><polyline points="'+pts+'" fill="none" stroke="#2ee6e6" stroke-width="1.6"/><circle cx="'+w+'" cy="'+((h-2)-(arr[arr.length-1]/mx*(h-4))).toFixed(1)+'" r="2.2" fill="#2ee6e6"/></svg>';
}
function kpi(l,v,sub,opt){ opt=opt||{};
  return '<div class="kpi" '+(opt.go?'onclick="switchPane(\''+opt.go+'\')"':'')+' title="'+esc(opt.tip||'')+'"><div class="l">'+l+'</div><div class="v">'+v+(opt.delta||'')+(opt.badge||'')+'</div>'+(opt.spark?spark(opt.spark):'')+(sub?'<div class="s">'+sub+'</div>':'')+'</div>';
}
function fanzaURL(code){ return 'https://www.dmm.co.jp/search/=/searchstr='+encodeURIComponent(code)+'/'; }
function moveBadge(key,k,idx){ const p=(PREV[key]||{})[k];
  if(p===undefined) return '<span class="mv new">NEW</span>';
  const d=p-idx; return d>0?'<span class="mv up">↑'+d+'</span>':(d<0?'<span class="mv dn">↓'+Math.abs(d)+'</span>':'<span class="mv fl">→</span>');
}
function barList(arr,opt){ opt=opt||{};
  if(!arr||!arr.length) return '<div class="empty">まだデータがありません</div>';
  const a=arr.slice(0,opt.n||TOPN); const mx=Math.max.apply(null,a.map(x=>x.c));
  let h='<div class="blist">'+a.map((x,i)=>{
    const nm=opt.fanza?'<a href="'+fanzaURL(x.k)+'" target="_blank" rel="noopener">'+esc(x.k)+'</a>':esc(x.k);
    return '<div class="row"><span class="rk">'+(i+1)+'</span>'+(opt.moveKey?moveBadge(opt.moveKey,x.k,i):'')+'<span class="nm">'+nm+'</span><span class="bar"><i style="width:'+Math.max(3,Math.round(x.c/mx*100))+'%"></i></span><span class="ct">'+nf(x.c)+'</span></div>';
  }).join('')+'</div>';
  if(opt.copy) h+='<div class="secops" style="margin-top:9px"><button class="sop" onclick="copyList(\''+opt.copy+'\')">📋 コピー</button><button class="sop" onclick="csvList(\''+opt.copy+'\')">⬇ CSV</button></div>';
  return h;
}
function copyList(key){ const a=(D.tops[key]||[]); copyText(a.map((x,i)=>(i+1)+'. '+x.k+' ('+x.c+')').join('\n')); }
function csvList(key){ const a=(D.tops[key]||[]); csvDL('fantok_'+key+'.csv',[['rank','name','count']].concat(a.map((x,i)=>[i+1,x.k,x.c]))); }
/* ---------- チャート ---------- */
function chartTrend(){
  const tr=(D.trend||[]).slice(-PERIOD); const mx=Math.max.apply(null,[1].concat(tr.map(x=>x.v)));
  const notes=ls('dash_notes')||[];
  return '<div class="trend">'+tr.map((x,i)=>{
    const h=Math.max(2,Math.round(x.v/mx*100)); const nwH=x.v>0?Math.round((x.nw||0)/x.v*h):0;

function chartWeekday(){
  const agg=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];

  const avg=agg.map((s,i)=>cnt[i]?Math.round(s/cnt[i]*10)/10:0); const mx=Math.max.apply(null,[1].concat(avg));
  return '<div class="hist" style="height:70px">'+avg.map((v,i)=>'<div class="hcol"><div class="hv">'+v+'</div><div class="hbar" style="height:'+Math.max(3,Math.round(v/mx*44))+'px;background:linear-gradient(180deg,var(--cy),#0bb1c6)"></div><div class="hl2">'+DOWS[i]+'</div></div>').join('')+'</div>';

function chartHeat(){

function chartHour(){

function dlAll(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'})); a.download='fantok_dashboard.json'; a.click(); }
function saveRev(){ ls('dash_rev',{cvr:+$g('sCvr').value||5,price:+$g('sPrice').value||1000,rate:+$g('sRate').value||35}); renderAll(); toast('保存しました'); }
function setPeriod(p){ PERIOD=p; ls('dash_period',p); renderAll(); }
function setTopN(n){ TOPN=n; ls('dash_topn',n); renderAll(); }
function setIv(v){ ls('dash_iv',v); setupIv(); toast('自動更新: '+(v==='0'?'OFF':v+'分')); }
/* ---------- サマリー(086/087/187) ---------- */
function renderSummary(){
  const k=D.kpi, tr=D.trend||[];
  const prev7=tr.slice(-8,-1).map(x=>x.v); const avg=prev7.length?prev7.reduce((a,b)=>a+b,0)/prev7.length:0;
  const topS=(D.tops.search[0]||{}).k;
  const ev=D.evAll||{t:{},a:{}};
  let chips=[];
  if(avg>0){ const r=k.todayVisits/avg;
    if(r>=1.3) chips.push('<span class="chip hot">🔥 訪問が7日平均の+'+Math.round((r-1)*100)+'%</span>');
    if(r<=0.5) chips.push('<span class="chip warn">⚠ 訪問が7日平均の-'+Math.round((1-r)*100)+'%</span>');
  }
  if((ev.t.buy||0)>0) chips.push('<span class="chip hot">💰 今日の購入クリック '+ev.t.buy+'件</span>');
  if((ev.t.err||0)>=3) chips.push('<span class="chip warn">🐞 JSエラー多発（今日'+ev.t.err+'件）</span>');
  const latestFb=(D.feedback||[])[0];
  if(latestFb && String(latestFb.ts)>(ls('dash_fbSeen')||'')) chips.push('<span class="chip warn">📮 新しい不具合報告あり</span>');
  $g('summary').innerHTML='今日は訪問 <b style="font-family:var(--mono)">'+nf(k.todayVisits)+'</b>（昨日比 '+delta(k.todayVisits,k.ydayVisits)+'）・購入クリック <b style="font-family:var(--mono)">'+nf(ev.t.buy||0)+'</b> 件'
    +(topS?'・検索TOPは「<b>'+esc(topS)+'</b>」':'')+'。'
    +(chips.length?'<div class="chips">'+chips.join('')+'</div>':'');
}
/* ---------- 週次レポ(189) ---------- */
function copyWeekly(){
  if(!D){toast('データ未取得');return;}
  const tr=(D.trend||[]).slice(-7); const v=tr.reduce((a,b)=>a+b.v,0), u=tr.reduce((a,b)=>a+b.u,0), nw=tr.reduce((a,b)=>a+(b.nw||0),0);
  const ev=D.evAll||{a:{},t:{}};
  const txt='【FANTOK 週次レポート】'+tr[0].date+'〜'+tr[6].date
    +'\n訪問 '+nf(v)+'（新規 '+nf(nw)+'）/ ユニーク延べ '+nf(u)
    +'\n購入クリック累計 '+nf(ev.a.buy||0)+' / 視聴累計 '+nf(ev.a.view||0)
    +'\n検索TOP: '+(D.tops.search.slice(0,3).map(x=>x.k).join(', ')||'—')
    +'\n人気品番: '+(D.tops.view.slice(0,3).map(x=>x.k).join(', ')||'—');
  copyText(txt,'週次レポをコピーしました');
}
/* ---------- 全データをAI講評用テキストに（ワンボタンコピー） ---------- */
function copyAll(){
  if(!D){ toast('データ未取得'); return; }
  const k=D.kpi, ev=D.evAll||{t:{},a:{}}, sw=D.swipe||{}, rt=D.retention||{}, pio=D.pio||{};
  const L=[];
  const topStr=(a,n)=>((a||[]).slice(0,n||8).map(x=>x.k+':'+x.c).join(', ')||'—');
  L.push('=== FANTOK 解析サマリー ===');
  L.push('生成: '+(D.generated||'—')+(D.cached?'（キャッシュ）':''));
  L.push('');
  L.push('【今日】訪問'+nf(k.todayVisits)+' / ユニーク'+nf(k.todayUniq)+' / 新規'+nf(k.todayNew)+'('+pct(k.todayNew,k.todayUniq)+'%) / 平均滞在'+fmtDur(k.avgDurTodaySec));
  L.push('【昨日比】訪問 '+(k.ydayVisits?((k.todayVisits-k.ydayVisits>=0?'+':'')+Math.round((k.todayVisits-k.ydayVisits)/k.ydayVisits*100)+'%'):'—')+'（昨日'+nf(k.ydayVisits)+'）');
  L.push('【累計】ユーザー'+nf(k.totalUsers)+' / セッション'+nf(k.totalSessions)+' / WAU'+nf(k.wau)+' / MAU'+nf(k.mau)+' / 直近7日訪問'+nf(k.last7Visits));
  L.push('');
  L.push('【直近7日・日別（日付 訪問/ユニーク/新規）】');
  (D.trend||[]).slice(-7).forEach(x=>{ const dw=DOWS[new Date(x.date+'T00:00:00').getDay()];
    L.push('  '+x.date+'('+dw+') '+nf(x.v)+' / '+nf(x.u)+' / '+nf(x.nw||0)); });
  L.push('');
  L.push('【収益】視聴 今日'+nf(ev.t.view||0)+'・累計'+nf(ev.a.view||0)+' / 購入クリック 今日'+nf(ev.t.buy||0)+'・累計'+nf(ev.a.buy||0)+' / 視聴→購入'+(D.rev&&D.rev.buyPerViewAll||0)+'%');
  L.push('【ファネル(累計)】訪問'+nf(k.totalSessions)+' → 視聴'+nf(ev.a.view||0)+' → 詳細'+nf(ev.a.detail_open||0)+' → 購入'+nf(ev.a.buy||0));
  L.push('【購入導線】'+topStr(D.tops&&D.tops.buy_from,6));
  L.push('【価格帯クリック(〜300/〜500/〜1k/〜2k/2k+)】'+((D.priceHist||[]).join(' / ')||'—'));
  L.push('【開拓モード】ON率'+(pio.onPct||0)+'% / 開拓経由の購入'+nf(pio.buyPio||0));
  L.push('');
  L.push('【人気検索】'+topStr(D.tops&&D.tops.search));
  L.push('【ヒット0件検索(機会損失)】'+topStr(D.tops&&D.tops.search0));
  L.push('【人気品番(視聴)】'+topStr(D.tops&&D.tops.view));
  L.push('【購入クリック品番】'+topStr(D.tops&&D.tops.buy));
  L.push('【人気ジャンル】'+topStr(D.tops&&D.tops.genre));
  L.push('【お気に入り】'+topStr(D.tops&&D.tops.like));
  L.push('');
  L.push('【行動】視聴/セッション'+(sw.sessions?Math.round(sw.views/sw.sessions*10)/10:'—')+' / 即スキップ率'+(sw.views?pct(sw.skips,sw.views)+'%':'—')+' / 平均深度'+(sw.avgDepth||'—'));
  L.push('【リテンション】D1 '+(rt.d1Pct||0)+'% ・ D7 '+(rt.d7Pct||0)+'%（30日コホート n='+nf(rt.cohortN||0)+'）');
  L.push('【滞在分布(〜30秒/〜1分/〜3分/〜10分/10分+)】'+((D.durHist||[]).join(' / ')||'—'));
  L.push('');
  L.push('【流入タグ(ref/utm)】'+topStr(D.srcs));
  L.push('【流入元ドメイン】'+topStr(D.referrers));
  L.push('【環境】端末 '+topStr(D.env&&D.env.dev,4)+' / OS '+topStr(D.env&&D.env.os,4)+' / ブラウザ '+topStr(D.env&&D.env.br,4));
  L.push('【技術】表示速度'+((D.perf&&D.perf.avgMs)?nf(D.perf.avgMs)+'ms':'—')+' / JSエラー 今日'+nf(ev.t.err||0)+'・累計'+nf(ev.a.err||0));
  const h=D.health||{};
  L.push('【ヘルス】sessions'+nf(h.sessions)+'行 / events'+nf(h.events)+'行 / 最終受信'+(h.lastTs||'—'));
  const fb=(D.feedback||[]).slice(0,5);
  if(fb.length){ L.push(''); L.push('【最近の不具合報告(最新5件)】'); fb.forEach(x=>L.push('  ['+x.ts+'] '+String(x.v).replace(/\n/g,' '))); }
  L.push('');
  L.push('=== ここまで。上記データについて、改善点・気づき・次の一手を教えてください ===');
  copyText(L.join('\n'), '全データをコピーしました。AIに貼り付けてフィードバックをもらえます');
}
/* ---------- タブ描画 ---------- */
function renderAll(){
  if(!D) return;
  $g('ver').textContent=VER; $g('rawL').href=SHEET;
  renderSummary();
  const fbNew=(D.feedback||[]).some(x=>String(x.ts)>(ls('dash_fbSeen')||''));
  const TABS=[
    ['overview','📊 概要',secOverview],
    ['revenue','💰 収益',secRevenue],
    ['popular','🔥 人気',secPopular],
    ['behavior','👥 行動',secBehavior],
    ['feedback','🐞 不具合'+((D.feedback||[]).length?' ('+D.feedback.length+')':''),secFeedback],
    ['env','⚙️ 環境',secEnv]
  ];
  if(!TABS.some(t=>t[0]===ACTIVE)) ACTIVE='overview';
  $g('tabbar').innerHTML=TABS.map(t=>'<button class="dtab'+(t[0]===ACTIVE?' on':'')+(t[0]==='feedback'&&fbNew?' unread':'')+'" data-pane="'+t[0]+'" onclick="switchPane(\''+t[0]+'\')">'+t[1]+'<span class="dot"></span></button>').join('');
  $g('main').innerHTML=TABS.map(t=>'<div class="tabpane'+(t[0]===ACTIVE?' active':'')+'" data-pane="'+t[0]+'">'+t[2]()+'</div>').join('');
  if(ACTIVE==='feedback'){ markFbSeen(); }
  renderFb();
  document.querySelectorAll('.sec h2').forEach(h=>{ h.onclick=(e)=>{ if(e.target.closest('button,a,input,select,label'))return; h.parentElement.classList.toggle('clps'); }; });
  const snap={}; ['view','buy','search'].forEach(k=>{ snap[k]={}; (D.tops[k]||[]).forEach((x,i)=>snap[k][x.k]=i); });
  ls('dash_prev',snap);
  fetch('data/gen-state.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const g=j.generated||j.time||''; const el=$g('freshV'); if(!el) return;
    if(!g){el.textContent='—';return;}
    const age=Math.round((Date.now()-new Date(g).getTime())/60000);
    el.innerHTML=esc(g)+'（'+(age<60?age+'分前':Math.round(age/60)+'時間前')+'）'+(age>420?' <span style="color:var(--dn)">⚠生成が止まっている可能性</span>':'');
  }).catch(()=>{ const el=$g('freshV'); if(el) el.textContent='—（fantok.org設置時のみ表示）'; });
  updRel();
}
function markFbSeen(){ const latest=((D.feedback||[])[0]||{}).ts||''; if(latest) ls('dash_fbSeen',String(latest)); document.querySelectorAll('.dtab[data-pane=feedback]').forEach(b=>b.classList.remove('unread')); }
function switchPane(n){ ACTIVE=n; ls('dash_tab',n); try{history.replaceState(null,'','#'+n);}catch(e){}
  document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('on',b.dataset.pane===n));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.dataset.pane===n));
  if(n==='feedback'){ markFbSeen(); renderFb(); }
  window.scrollTo(0,0);
}
/* ---------- 相対時刻(063)・自動更新(064) ---------- */
function updRel(){ if(!fetchedAt){$g('upd').textContent='—';return;}
  const m=Math.round((Date.now()-fetchedAt)/60000);
  $g('upd').textContent='最終更新: '+(m<1?'たった今':m+'分前')+'（生成 '+(D&&D.generated||'—')+'）'; }
setInterval(updRel,30000);
let _ivT=null;
function setupIv(){ if(_ivT)clearInterval(_ivT); const v=+(ls('dash_iv')||'5'); if(v>0)_ivT=setInterval(()=>loadData(false),v*60000); }
/* ---------- ぼかし(097)/戻る(007)/ハッシュ(072)/PTR(061) ---------- */
function toggleBlur(){ document.body.classList.toggle('blurnum'); }
addEventListener('scroll',()=>{ $g('topBtn').style.display=scrollY>600?'block':'none'; });
addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==ACTIVE) switchPane(h); });
let _py=0,_pull=0;
addEventListener('touchstart',e=>{ _py=(scrollY<=0)?e.touches[0].clientY:0; _pull=0; },{passive:true});
addEventListener('touchmove',e=>{ if(!_py)return; _pull=e.touches[0].clientY-_py;
  if(_pull>10){ $g('ptr').style.height=Math.min(44,_pull*0.4)+'px'; } },{passive:true});
addEventListener('touchend',()=>{ if(_pull>90){ loadData(true); } $g('ptr').style.height='0'; _py=0;_pull=0; },{passive:true});
/* ---------- 起動 ---------- */
if(ls('dash_pin')){ $g('pinOv').style.display='flex'; }
setupIv(); loadData(false);
</script>
